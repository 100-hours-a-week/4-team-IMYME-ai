name: AI CI → ECR (Kubernetes Deploy via ArgoCD)

on:
  pull_request:
    branches:
      # - main
      - feat/k8sCI
    paths:
      - ".github/**"
      - "ai_server/**"
  push:
    branches:
      # - main
      - feat/k8sCI
    paths:
      - ".github/**"
      - "ai_server/**"

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ai_server/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ai_server/requirements.txt
          pip install ruff pytest

      - name: Run Ruff Lint
        run: ruff check ai_server/

      - name: Run Ruff Format Check
        run: ruff format --check ai_server/

      - name: Run Tests
        working-directory: ai_server
        run: pytest || echo "No tests found, skipping."

  image-push:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/k8sCI'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ai_server
          file: ./ai_server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            219268921033.dkr.ecr.ap-northeast-2.amazonaws.com/imyme-ai:${{ github.sha }}
            219268921033.dkr.ecr.ap-northeast-2.amazonaws.com/imyme-ai:yujin-test-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-notify-success:
    needs: ci
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Discord CI success
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_AI }}
          status: success
          title: "🟢 AI CI Success"
          content: "<@&${{ secrets.AI_ROLE_ID }}> AI CI 성공!"
          color: 0x00FF00

  ci-notify-failure:
    needs: ci
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Discord CI failure
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_AI }}
          status: failure
          title: "🔴 AI CI Failed"
          content: "<@&${{ secrets.AI_ROLE_ID }}> AI CI 실패!"
          color: 0xFF0000

  image-push-notify-success:
    needs: image-push
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Discord image push success
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_AI }}
          status: success
          title: "🟢 AI Image Push Success"
          content: "운영용 AI 이미지 ECR 푸시 완료! 이후 배포는 ArgoCD가 수행합니다."
          color: 0x00FF00

  image-push-notify-failure:
    needs: image-push
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Discord image push failure
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_AI }}
          status: failure
          title: "🔴 AI Image Push Failed"
          content: "<@&${{ secrets.AI_ROLE_ID }}> 운영용 AI 이미지 ECR 푸시 실패!"
          color: 0xFF0000
